name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - run: cd packages/core && npm test
      - run: cd apps/web && npx next build
        env: { NEXT_PUBLIC_SITE_URL: https://tokseal.vercel.app }
