# Weekly: pull LiteLLM prices into packages/core/src/pricing-data.ts and commit if changed.
name: sync-pricing
on:
  schedule: [{ cron: '0 3 * * 1' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run sync-pricing -w @tokseal/core
      - run: npm run build -w @tokseal/core && cd packages/core && npm test
      - name: Commit if changed
        run: |
          if git diff --quiet -- packages/core/src/pricing-data.ts; then echo "no changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/src/pricing-data.ts
          git commit -m "chore(pricing): weekly LiteLLM sync"
          git push
