# Publishes `tokseal` to npm via Trusted Publishing (OIDC) whenever a v* tag is pushed.
# No npm token is stored anywhere: npm trusts this repo + workflow file directly.
# One-time setup on npmjs.com → package tokseal → Settings → Trusted Publisher:
#   provider GitHub Actions, owner LenChoi, repo tokseal, workflow publish.yml
name: publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: cd packages/core && npm test
      - name: Skip if this version is already on npm
        id: check
        run: |
          V=$(node -p "require('./packages/cli/package.json').version")
          if npm view "tokseal@$V" version >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "tokseal@$V already published"; fi
      - name: Publish tokseal
        if: steps.check.outputs.skip != 'true'
        run: npm publish -w tokseal --provenance --access public
